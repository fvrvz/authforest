<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In - AuthForest</title>
    <style>
      :root {
        --primary: #4f46e5;
        --primary-hover: #4338ca;
        --primary-ring: rgba(79, 70, 229, 0.25);
        --bg: #f9fafb;
        --card-bg: #ffffff;
        --border: #e5e7eb;
        --text: #111827;
        --text-secondary: #6b7280;
        --text-muted: #9ca3af;
        --input-bg: #ffffff;
        --input-border: #d1d5db;
        --badge-bg: #eef2ff;
        --badge-text: #3730a3;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --primary: #818cf8;
          --primary-hover: #4f46e5;
          --primary-ring: rgba(129, 140, 248, 0.25);
          --bg: #111827;
          --card-bg: #1f2937;
          --border: #374151;
          --text: #f9fafb;
          --text-secondary: #9ca3af;
          --text-muted: #9ca3af;
          --input-bg: #374151;
          --input-border: #4b5563;
          --badge-bg: #312e81;
          --badge-text: #e0e7ff;
        }
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background-color: var(--bg);
        color: var(--text);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 1rem;
      }

      .card {
        background-color: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
        padding: 2.25rem;
        width: 100%;
        max-width: 420px;
      }

      .header {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        margin-bottom: 1.75rem;
      }

      .logo-icon {
        width: 44px;
        height: 44px;
        color: var(--primary);
        margin-bottom: 0.75rem;
      }

      h1 {
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: -0.025em;
        color: var(--text);
        margin-bottom: 0.35rem;
      }

      .subtitle {
        color: var(--text-secondary);
        font-size: 0.875rem;
      }

      .client-name {
        font-weight: 600;
        color: var(--text);
      }

      .error {
        background-color: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.2);
        color: #ef4444;
        padding: 0.75rem 1rem;
        border-radius: 8px;
        margin-bottom: 1.25rem;
        font-size: 0.875rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .form-group {
        margin-bottom: 1.25rem;
      }

      label {
        display: block;
        margin-bottom: 0.4rem;
        font-weight: 500;
        color: var(--text);
        font-size: 0.875rem;
      }

      .input-control {
        width: 100%;
        padding: 0.65rem 0.875rem;
        background-color: var(--input-bg);
        border: 1px solid var(--input-border);
        border-radius: 8px;
        font-size: 0.9375rem;
        color: var(--text);
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }

      .input-control:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px var(--primary-ring);
      }

      .password-container {
        position: relative;
        width: 100%;
      }

      .password-container input {
        padding-right: 2.75rem;
      }

      .toggle-password {
        position: absolute;
        right: 0.625rem;
        top: 50%;
        transform: translateY(-50%);
        background: transparent;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        padding: 0.25rem;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: color 0.15s ease, background-color 0.15s ease;
      }

      .toggle-password:hover {
        color: var(--text);
        background-color: rgba(0, 0, 0, 0.05);
      }

      @media (prefers-color-scheme: dark) {
        .toggle-password:hover {
          background-color: rgba(255, 255, 255, 0.08);
        }
      }

      .toggle-password svg {
        width: 20px;
        height: 20px;
      }

      .btn-submit {
        width: 100%;
        padding: 0.75rem 1rem;
        background-color: var(--primary);
        color: #ffffff;
        border: none;
        border-radius: 8px;
        font-size: 0.9375rem;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.15s ease, transform 0.1s ease;
        margin-top: 0.5rem;
      }

      .btn-submit:hover {
        background-color: var(--primary-hover);
      }

      .btn-submit:active {
        transform: scale(0.99);
      }

      .footer-actions {
        margin-top: 1.5rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
      }

      .back-link {
        color: var(--text-muted);
        font-size: 0.875rem;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        transition: color 0.15s ease;
      }

      .back-link:hover {
        color: var(--primary);
      }

      .scopes {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 0.4rem;
        font-size: 0.75rem;
        color: var(--text-muted);
        margin-top: 0.5rem;
      }

      .scope-pill {
        background-color: var(--badge-bg);
        color: var(--badge-text);
        padding: 0.15rem 0.5rem;
        border-radius: 9999px;
        font-family: monospace;
        font-size: 0.75rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="header">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="m17 14 3 3.3a1 1 0 0 1-.7 1.7H4.7a1 1 0 0 1-.7-1.7L7 14h-3l4-4.5h-2L12 3l6 6.5h-2L20 14z"/>
          <path d="M12 19v3"/>
        </svg>
        <h1>Sign In to AuthForest</h1>
        <p class="subtitle"><span class="client-name">{{.client_name}}</span> is requesting access</p>
      </div>

      {{if .error}}
      <div class="error">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span>{{.error}}</span>
      </div>
      {{end}}

      <form method="POST" action="/oauth2/authorize">
        <input type="hidden" name="client_id" value="{{.client_id}}" />
        <input type="hidden" name="redirect_uri" value="{{.redirect_uri}}" />
        <input type="hidden" name="scope" value="{{.scope}}" />
        <input type="hidden" name="state" value="{{.state}}" />
        <input type="hidden" name="nonce" value="{{.nonce}}" />
        <input type="hidden" name="code_challenge" value="{{.code_challenge}}" />
        <input type="hidden" name="code_challenge_method" value="{{.code_challenge_method}}" />

        <div class="form-group">
          <label for="username">Username or Email</label>
          <input type="text" id="username" name="username" class="input-control" placeholder="Enter username or email" required autofocus />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-container">
            <input type="password" id="password" name="password" class="input-control" placeholder="Enter password" required />
            <button type="button" class="toggle-password" id="togglePassword" aria-label="Toggle password visibility" title="Show password">
              <!-- Eye Open Icon -->
              <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <!-- Eye Off Icon (Hidden by default) -->
              <svg id="eyeOffIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                <path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
                <line x1="2" x2="22" y1="2" y2="22"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-submit">Sign In</button>
      </form>

      <div class="footer-actions">
        {{if .redirect_uri}}
        <a href="#" id="cancelBtn" class="back-link">
          &larr; Cancel and return to {{.client_name}}
        </a>
        {{end}}

        {{if .scope}}
        <div class="scopes">
          <span>Requested scopes:</span>
          <span class="scope-pill">{{.scope}}</span>
        </div>
        {{end}}
      </div>
    </div>

    <script>
      const toggleBtn = document.getElementById('togglePassword');
      const passwordInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eyeIcon');
      const eyeOffIcon = document.getElementById('eyeOffIcon');

      toggleBtn.addEventListener('click', function () {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        
        if (isPassword) {
          passwordInput.setAttribute('type', 'text');
          eyeIcon.style.display = 'none';
          eyeOffIcon.style.display = 'block';
          toggleBtn.setAttribute('title', 'Hide password');
        } else {
          passwordInput.setAttribute('type', 'password');
          eyeIcon.style.display = 'block';
          eyeOffIcon.style.display = 'none';
          toggleBtn.setAttribute('title', 'Show password');
        }
      });

      // Handle cancel link click cleanly to navigate back to client app root
      document.getElementById('cancelBtn')?.addEventListener('click', function(e) {
        e.preventDefault();
        try {
          const redirectUri = "{{.redirect_uri}}";
          const url = new URL(redirectUri);
          window.location.href = url.origin;
        } catch (err) {
          window.location.href = "/";
        }
      });
    </script>
  </body>
</html>
